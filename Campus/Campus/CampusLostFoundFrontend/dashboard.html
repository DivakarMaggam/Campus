<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand fw-bold">
            Campus Lost & Found Portal
        </span>

        <button class="btn btn-light" onclick="logout()">
            Logout
        </button>

    </div>
</nav>

<div class="container mt-5">

    <h2 class="text-center mb-2">
        Welcome
    </h2>

    <h2 class="text-center mb-5">Buddy!</h2>

    <div class="row g-4">

        <div class="col-md-6">

    <a href="report-item.html?type=LOST" class="text-decoration-none">

        <div class="feature-card">

            <h3>Report Lost Item</h3>

            <p>Report an item that you have lost.</p>

        </div>

    </a>

</div>

<div class="col-md-6">

    <a href="report-item.html?type=FOUND" class="text-decoration-none">

        <div class="feature-card">

            <h3>Report Found Item</h3>

            <p>Report an item that you have found.</p>

        </div>

    </a>

</div>

        <div class="col-md-6">

            <a href="items.html" class="text-decoration-none">

                <div class="feature-card">

                    <h3>View Items</h3>

                    <p>Browse all reported items.</p>

                </div>

            </a>

        </div>

        <div class="col-md-6">

            <a href="items.html" class="text-decoration-none">

                <div class="feature-card">

                    <h3>Search Items</h3>

                    <p>Search lost or found items.</p>

                </div>

            </a>

        </div>

        <div class="col-md-6">

            <a href="claim.html" class="text-decoration-none">

                <div class="feature-card">

                    <h3>Claim Item</h3>

                    <p>Submit ownership requests.</p>

                </div>

            </a>

        </div>

    </div>

</div>

<script>

document.getElementById("userEmail").innerHTML =
localStorage.getItem("userEmail");

function logout(){

localStorage.clear();

window.location.href="login.html";

}

</script>

</body>

</html>
