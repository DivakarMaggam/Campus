<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Claim Item</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">Claim Found Item</h2>

        <form id="claimForm">
            <input type="hidden" id="itemId">
            <input type="hidden" id="email">

            <div class="mb-3">
                <label id="q1" class="form-label"></label>
                <input type="text" id="answer1" class="form-control" required>
            </div>

            <div class="mb-3">
                <label id="q2" class="form-label"></label>
                <input type="text" id="answer2" class="form-control" required>
            </div>

            <div class="mb-3">
                <label id="q3" class="form-label"></label>
                <input type="text" id="answer3" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Upload Proof</label>
                <input type="file" id="proofImage" class="form-control">
            </div>

            <div class="d-flex justify-content-between">

                <a href="items.html" class="btn btn-secondary">
                    Back
                </a>

                <button class="btn btn-success">
                    Submit Claim
                </button>

            </div>

        </form>

        <div id="message" class="mt-3"></div>

    </div>

</div>

<script src="js/claim.js"></script>

</body>
</html>
